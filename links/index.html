<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links — Samuel David Adams</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="../style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page-shell">
    <a class="back-link" href="../">&larr; Back</a>

    <h1>Links</h1>
    <p class="tagline page-intro">Cool things I've found across the internet.</p>

    <div class="entry-loading" id="linksLoading" style="margin-top: 2.5rem;">
      <span class="hex-spinner" style="--spinner-size: 2rem;" role="status" aria-label="Loading"></span>
    </div>
    <div class="hive" id="linksHive"></div>
    <p class="entry-empty" id="linksEmpty" hidden>Nothing here yet — check back soon.</p>
  </div>

  <script src="/script.js"></script>
  <script>
    fetch("links.json")
      .then(function (res) { return res.json(); })
      .then(function (links) {
        document.getElementById("linksLoading").remove();
        var hive = document.getElementById("linksHive");
        var empty = document.getElementById("linksEmpty");
        if (!links.length) {
          empty.hidden = false;
          return;
        }
        links.forEach(function (link) {
          var a = document.createElement("a");
          a.className = "app-icon";
          a.href = link.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.setAttribute("aria-label", link.title);
          if (link.note) a.title = link.note;

          a.innerHTML =
            '<span class="app-icon-hex">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>' +
            '<path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>' +
            "</svg>" +
            '<span class="app-icon-label"></span>' +
            "</span>";
          a.querySelector(".app-icon-label").textContent = link.title;

          hive.appendChild(a);
        });

        if (window.layoutHives) window.layoutHives();
      })
      .catch(function () {
        var loading = document.getElementById("linksLoading");
        if (loading) loading.remove();
        document.getElementById("linksEmpty").hidden = false;
      });
  </script>
</body>
</html>
