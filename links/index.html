<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links — Samuel David Adams</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="../style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page-shell">
    <a class="back-link" href="../">&larr; Back</a>

    <h1>Links</h1>
    <p class="tagline page-intro">Cool things I've found across the internet.</p>

    <div class="entry-loading" id="linksLoading" style="margin-top: 2.5rem;">
      <span class="hex-spinner" style="--spinner-size: 2rem;" role="status" aria-label="Loading"></span>
    </div>
    <ul class="entry-list" id="linksList"></ul>
    <p class="entry-empty" id="linksEmpty" hidden>Nothing here yet — check back soon.</p>
  </div>

  <script src="/script.js"></script>
  <script>
    fetch("links.json")
      .then(function (res) { return res.json(); })
      .then(function (links) {
        document.getElementById("linksLoading").remove();
        var list = document.getElementById("linksList");
        var empty = document.getElementById("linksEmpty");
        if (!links.length) {
          empty.hidden = false;
          return;
        }
        links.forEach(function (link) {
          var li = document.createElement("li");
          li.className = "entry-item";

          var a = document.createElement("a");
          a.href = link.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = link.title;
          li.appendChild(a);

          if (link.note) {
            var note = document.createElement("p");
            note.className = "entry-note";
            note.textContent = link.note;
            li.appendChild(note);
          }

          list.appendChild(li);
        });
      })
      .catch(function () {
        var loading = document.getElementById("linksLoading");
        if (loading) loading.remove();
        document.getElementById("linksEmpty").hidden = false;
      });
  </script>
</body>
</html>
