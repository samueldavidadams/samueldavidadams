    <div class="verse">
      <p class="verse-title">Untitled I</p>
      Placeholder line one, short and plain.
      A second line to test the rhythm.
      A third, a little longer than the rest,
      just to see how it wraps on a narrow screen.
    </div>

      <p class="verse-title">Untitled II</p>
      A shorter placeholder.
      Two lines only.
