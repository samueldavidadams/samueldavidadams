<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="dock-bar" id="dockBar">
    <div class="dock-avatar">
      <img src="assets/avatar.jpg" alt="Samuel David Adams">
    </div>
    <span class="dock-title" id="dockGreeting">Welcome!</span>
    <div class="dock-socials">
      <a href="https://www.instagram.com/__samuel__adams.x" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
        </svg>
      </a>
      <a href="https://x.com/__samuel__adams" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>

    </div>

  <section class="pages">
    <div class="hive">
      <a class="app-icon" href="reading/" aria-label="Reading">
        <span class="app-icon-hex">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H12v18H6.5A2.5 2.5 0 0 0 4 22.5z"/>
            <path d="M20 4.5A2.5 2.5 0 0 0 17.5 2H12v18h5.5a2.5 2.5 0 0 1 2.5 2.5z"/>
          </svg>
          <span class="app-icon-label">Reading</span>
        </span>
      </a>
      <a class="app-icon" href="poetry/" aria-label="Poetry">
        <span class="app-icon-hex">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/>
          </svg>
          <span class="app-icon-label">Poetry</span>
        </span>
      </a>
      <a class="app-icon" href="philosophy/" aria-label="Philosophy">
        <span class="app-icon-hex">
          <span class="app-icon-glyph">&Phi;</span>
          <span class="app-icon-label">Philosophy</span>
        </span>
      </a>
      <a class="app-icon" href="projects/" aria-label="Website Projects">
        <span class="app-icon-hex">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"/>
            <polyline points="8 6 2 12 8 18"/>
          </svg>
          <span class="app-icon-label">Projects</span>
        </span>
      </a>
      <a class="app-icon" href="mathematics/" aria-label="Mathematics">
        <span class="app-icon-hex">
          <span class="app-icon-glyph">&pi;</span>
          <span class="app-icon-label">Mathematics</span>
        </span>
      </a>
      <a class="app-icon" href="links/" aria-label="Links">
        <span class="app-icon-hex">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          <span class="app-icon-label">Links</span>
        </span>
      </a>
      <a class="app-icon" href="cryptocurrency/" aria-label="Cryptocurrency">
        <span class="app-icon-hex">
          <span class="app-icon-glyph">&#8383;</span>
          <span class="app-icon-label">Cryptocurrency</span>
        </span>
      </a>
      <a class="app-icon" href="exercise/" aria-label="Exercise">
        <span class="app-icon-hex">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="4" cy="12" r="2"/>
            <circle cx="20" cy="12" r="2"/>
            <line x1="6" y1="12" x2="18" y2="12"/>
            <line x1="9" y1="9" x2="9" y2="15"/>
            <line x1="15" y1="9" x2="15" y2="15"/>
          </svg>
          <span class="app-icon-label">Exercise</span>
        </span>
      </a>
    </div>
  </section>

  <script src="/script.js"></script>
  <script>
    var dockBar = document.getElementById("dockBar");
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        dockBar.classList.add("visible");
      });
    });

    var hive = document.querySelector(".hive");
    var icons = Array.prototype.slice.call(hive.children);
    icons.forEach(function (el, i) {
      el.style.animationDelay = (i * 0.15) + "s";
    });

    function layoutHive() {
      // approximates the CSS clamp(5.5rem, 24vw, 8.5rem) used for --hex-w
      var hexW = Math.min(Math.max(88, window.innerWidth * 0.24), 136);
      var containerWidth = hive.clientWidth || hexW;
      var cols = Math.max(1, Math.floor(containerWidth / hexW));

      hive.innerHTML = "";
      var i = 0;
      var rowIndex = 0;
      while (i < icons.length) {
        var count = rowIndex % 2 === 0 ? cols : Math.max(1, cols - 1);
        var row = document.createElement("div");
        row.className = "hive-row";
        for (var c = 0; c < count && i < icons.length; c++, i++) {
          row.appendChild(icons[i]);
        }
        hive.appendChild(row);
        rowIndex++;
      }
    }

    layoutHive();
    window.addEventListener("resize", function () {
      icons.forEach(function (el) {
        el.style.animation = "none";
      });
      layoutHive();
    });

    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!reduceMotion) {
      (function scheduleFlip() {
        var delay = 4000 + Math.random() * 6000;
        setTimeout(function () {
          var hexes = hive.querySelectorAll(".app-icon-hex");
          if (hexes.length) {
            var target = hexes[Math.floor(Math.random() * hexes.length)];
            target.classList.add("flipping");
            target.addEventListener("animationend", function handler() {
              target.classList.remove("flipping");
              target.removeEventListener("animationend", handler);
            });
          }
          scheduleFlip();
        }, delay);
      })();
    }
  </script>
</body>
</html>
