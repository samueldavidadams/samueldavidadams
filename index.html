<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samuel David Adams</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="scroll-sentinel"></div>

  <header class="dock-bar" id="dockBar">
    <div class="dock-avatar">
      <img src="assets/avatar.jpg" alt="Samuel David Adams">
    </div>
    <span class="dock-title" id="dockGreeting">Welcome!</span>
    <div class="dock-socials">
      <a href="https://www.instagram.com/__samuel__adams.x" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
        </svg>
      </a>
      <a href="https://x.com/__samuel__adams" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
      </a>
    </div>
  </header>

  <div class="hero">
    <div class="hero-content">
      <div class="avatar">
        <img src="assets/avatar.jpg" alt="Samuel David Adams">
      </div>
      <h1 id="greeting">Welcome!</h1>
      <p class="tagline">Chiropractor-turned-entrepreneur. Building The157store and exploring AI's role in practical, purpose-driven business.</p>
      <div class="social-links">
        <a href="https://www.instagram.com/__samuel__adams.x" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
          </svg>
        </a>
        <a href="https://x.com/__samuel__adams" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
        </a>
      </div>
    </div>
  </div>

  <section class="pages">
    <div class="app-cluster">
      <a class="app-icon app-icon--center" href="reading/" aria-label="Reading" style="--size: clamp(5.5rem, 24vw, 8rem); top: 50%; left: 50%;">
        <span class="app-icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H12v18H6.5A2.5 2.5 0 0 0 4 22.5z"/>
            <path d="M20 4.5A2.5 2.5 0 0 0 17.5 2H12v18h5.5a2.5 2.5 0 0 1 2.5 2.5z"/>
          </svg>
        </span>
        <span class="app-icon-label">Reading</span>
      </a>
      <a class="app-icon" href="poetry/" aria-label="Poetry" style="--size: clamp(3.2rem, 14vw, 5rem); top: 12%; left: 50%;">
        <span class="app-icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/>
          </svg>
        </span>
        <span class="app-icon-label">Poetry</span>
      </a>
      <a class="app-icon" href="philosophy/" aria-label="Philosophy" style="--size: clamp(3.2rem, 14vw, 5rem); top: 50%; left: 88%;">
        <span class="app-icon-circle">
          <span class="app-icon-glyph">&Phi;</span>
        </span>
        <span class="app-icon-label">Philosophy</span>
      </a>
      <a class="app-icon" href="projects/" aria-label="Website Projects" style="--size: clamp(3.2rem, 14vw, 5rem); top: 88%; left: 50%;">
        <span class="app-icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"/>
            <polyline points="8 6 2 12 8 18"/>
          </svg>
        </span>
        <span class="app-icon-label">Projects</span>
      </a>
      <a class="app-icon" href="mathematics/" aria-label="Mathematics" style="--size: clamp(3.2rem, 14vw, 5rem); top: 50%; left: 12%;">
        <span class="app-icon-circle">
          <span class="app-icon-glyph">&pi;</span>
        </span>
        <span class="app-icon-label">Mathematics</span>
      </a>
      <a class="app-icon" href="links/" aria-label="Links" style="--size: clamp(3.2rem, 14vw, 5rem); top: 22%; left: 78%;">
        <span class="app-icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </span>
        <span class="app-icon-label">Links</span>
      </a>
    </div>
  </section>

  <script>
    var hour = new Date().getHours();
    var greeting = hour < 12 ? "Good morning!" : hour < 18 ? "Good afternoon!" : "Good evening!";
    document.getElementById("greeting").textContent = greeting;
    document.getElementById("dockGreeting").textContent = greeting;

    var dockBar = document.getElementById("dockBar");
    var heroContent = document.querySelector(".hero-content");
    var sentinel = document.getElementById("scroll-sentinel");

    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        heroContent.classList.add("revealed");
      });
    });

    var observer = new IntersectionObserver(function (entries) {
      var scrolled = !entries[0].isIntersecting;
      dockBar.classList.toggle("visible", scrolled);
      heroContent.classList.toggle("faded", scrolled);
    });
    observer.observe(sentinel);
  </script>
</body>
</html>
